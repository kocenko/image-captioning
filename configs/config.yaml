checkpoints_folder: "./checkpoints"
model:
  patching:
    pretrained_weights_path: "../pretrained_weights/pytorch_model.bin"
    hyperparameters:
      batches: 32
      learning_rate: 0.0001
      epochs: 300
      steps_per_epoch: 100
      eval_iterations: 20
      max_caption_length: 50
      vocabulary_size: 6000
      banned_tokens: [ "[unknown]", "[start]", "" ]
      embeddings: 256
      heads_num: 4
      dropout_rate: 0.5
      decoder_layers: 4
      encoder_layers: 12
      image_size: 224
      encoder_embeddings: 768
      encoder_sequence_size: 14
      encoder_heads_num: 12
      patch_size: 16
      shift_pixels: 5
  mobilenet:
    feature_extractor: "mobilenet"
    layer_name: "features.12"
    hyperparameters:
      batches: 32
      learning_rate: 0.0001
      epochs: 300
      steps_per_epoch: 100
      eval_iterations: 20
      max_caption_length: 50
      vocabulary_size: 6000
      banned_tokens: [ "[unknown]", "[start]", "" ]
      embeddings: 256
      heads_num: 4
      dropout_rate: 0.5
      decoder_layers: 4
      image_size: 224
      encoder_embeddings: 576
      encoder_sequence_size: 7
  vgg:
    feature_extractor: "vgg"
    layer_name: "features.39"
    hyperparameters:
      batches: 32
      learning_rate: 0.0001
      epochs: 300
      steps_per_epoch: 100
      eval_iterations: 20
      max_caption_length: 50
      vocabulary_size: 6000
      banned_tokens: [ "[unknown]", "[start]", "" ]
      embeddings: 256
      heads_num: 4
      dropout_rate: 0.5
      decoder_layers: 4
      image_size: 224
      encoder_embeddings: 512
      encoder_sequence_size: 14
dataset:
  flickr8k:
    name: "flickr8k"
    dataset_paths:
      tokens_path: "../dataset/Flickr8k.token.txt"
      train_path: "../dataset/Flickr_8k.trainImages.txt"
      valid_path: "../dataset/Flickr_8k.devImages.txt"
      test_path: "../dataset/Flickr_8k.testImages.txt"
      images_path: "../dataset/images"
  flickr30k:
    name: "flickr30k"
    dataset_paths:
      tokens_path: "../dataset/flickr30k/captions.txt"
      images_path: "../dataset/flickr30k/Images"
  vizwiz:
    name: "vizwiz"
    dataset_paths:
      train_images_path: '../vizwiz/train'
      valid_images_path: '../vizwiz/val'
      train_annotations: '../vizwiz/annotations/train.json'
      valid_annotations: '../vizwiz/annotations/val.json'
sample_images: ["./evaluation/sample_images/dog.jpg", "./evaluation/sample_images/tomato.jpg"]