dataset_name: "vizwiz"
dataset_paths:
  train_images_path: '../vizwiz/train'
  valid_images_path: '../vizwiz/val'
  train_annotations: '../vizwiz/annotations/train.json'
  valid_annotations: '../vizwiz/annotations/val.json'
hyperparameters:
  batches: 32
  max_caption_length: 50
  vocabulary_size: 7000
  banned_tokens: ["[unknown]", "[start]", ""]
  embeddings: 768
  dropout_rate: 0.5
  patch_size: 16
  image_size: 224
  shift_pixels: 5
  encoder_layers: 12
  decoder_layers: 4
  learning_rate: 0.0001
  epochs: 100
  heads_num: 12
  eval_iterations: 20
  steps_per_epoch: 100
sample_image: "./evaluation/sample_images/pills.jpg"
checkpoints_folder: "./checkpoints"
pretrained_weights_path: "../pretrained_weights/pytorch_model.bin"