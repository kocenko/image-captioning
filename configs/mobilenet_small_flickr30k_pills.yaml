dataset_name: "flickr30k"
dataset_paths:
  tokens_path: "../dataset/flickr30k/captions.txt"
  images_path: "../dataset/flickr30k/Images"
hyperparameters:
  batches: 32
  max_caption_length: 50
  vocabulary_size: 5000
  banned_tokens: ["[unknown]", "[start]", ""]
  embeddings: 256
  dropout_rate: 0.5
  image_size: 224
  decoder_layers: 2
  learning_rate: 0.0001
  epochs: 200
  heads_num: 2
  eval_iterations: 20
  steps_per_epoch: 100
sample_image: "./evaluation/sample_images/pills.jpg"
checkpoints_folder: "./checkpoints"
feature_extractor: "mobilenet"
layer_name: "features.12"
feature_maps_dim: 576
feature_maps_size: 7
