dataset_name: "vizwiz"
dataset_paths:
  train_images_path: '../vizwiz/train'
  valid_images_path: '../vizwiz/val'
  train_annotations: '../vizwiz/annotations/train.json'
  valid_annotations: '../vizwiz/annotations/val.json'
hyperparameters:
  batches: 32
  max_caption_length: 50
  vocabulary_size: 6000
  banned_tokens: ["[unknown]", "[start]", ""]
  embeddings: 256
  dropout_rate: 0.5
  image_size: 224
  decoder_layers: 2
  learning_rate: 0.0001
  epochs: 100
  heads_num: 4
  eval_iterations: 20
  steps_per_epoch: 100
sample_image: "./evaluation/sample_images/pills.jpg"
checkpoints_folder: "./checkpoints"
feature_extractor: "vgg"
layer_name: "features.39"
feature_maps_dim: 512
feature_maps_size: 14
